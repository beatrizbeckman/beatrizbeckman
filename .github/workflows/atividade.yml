name: atividade

on:
  schedule:
    - cron: "23 9 * * *" # todo dia, 06:23 no horário de Brasília
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Gera atividade.svg
        run: python3 .github/scripts/atividade.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}

      # publica só a imagem numa branch separada (output), sem encher o histórico da main
      - name: Publica na branch output
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atividade.svg
          git commit -q -m "atividade"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
